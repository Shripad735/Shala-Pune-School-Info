# pnpm 10+ reads settings such as nodeLinker and the build-script allowlist from
# this file only, and ignores .npmrc for them. pnpm 9 rejects a workspace file
# with no `packages:` field, so declare the root package; pnpm 9 ignores every
# other key here.
packages:
  - "."

nodeLinker: hoisted

# Packages with native postinstall steps. pnpm 10 reads onlyBuiltDependencies,
# pnpm 11 reads allowBuilds — without an entry for the running version, install
# exits non-zero and fails the CI build.
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - sharp
allowBuilds:
  "@tailwindcss/oxide": true
  sharp: true